      <h1>红色只用一次</h1>
      <div class="prose">
        <p>一个项目里，我只给自己一次强调色。通常是朱红，偶尔是花青。用到第二次，它就变成装饰。</p>
        <p>装饰不是过错。装饰一多，眼睛就不知道先看哪里。</p>
        <p>「字体周」那张海报，整张只有米白和墨。红只用在日期下面，一条两毫米的线。有人说太素。我问他还记不记得日期。他记得。线就够了。</p>
        <p>选色的时候，我会先假定不用颜色也能成立。成立了，再决定那一次红放在哪个字上。放不进去，就说明这张东西还不需要红。</p>
        <p>颜色是用来指路的。它不是用来证明你会用色。</p>
      </div>
