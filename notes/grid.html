      <h1>网格是用来打破的</h1>
      <div class="prose">
        <p>网格先画满。栏、行、基线，能对齐的都对齐。然后只打破一处。</p>
        <p>打破一处，别人会觉得是故意的。打破三处，看起来就像没对齐。我早些年喜欢到处错开，以为那是节奏。后来才看清，节奏来自重复，不来自例外。</p>
        <p>例外要少，少到能被记住。一张海报里，我通常只允许一个元素不在网格上。它负责让画面有一个呼吸的口。口再多，气就漏光了。</p>
