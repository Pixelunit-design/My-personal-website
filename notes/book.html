      <h1>给自己做一本书</h1>
      <div class="prose">
        <p>每年年底，我给自己印一本薄册子。四十页左右，收这一年没发出去的东西：废弃的网格、写坏的句子、被否掉的封面。不卖。印三十本，送给常一起干活的人。</p>
        <p>为什么要印。屏幕上的「差不多」，到了纸上会露出来。对不齐、字重发虚、出血没算，装订之后都没法再辩解。</p>
        <p>今年这本叫《未采用》。封面没有书名，书脊上有三个字。第一页只有一句：这些是没被选中的。后面不再解释。</p>
        <p>没有客户，也没有截止日期的时候，你留下的就是你的标准。这本小书是用来提醒我这件事的。</p>
      </div>
