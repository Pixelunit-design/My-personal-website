      <h1>「再大气一点」</h1>
      <div class="prose">
        <p>客户说「再大气一点」的时候，很少是在说尺寸。他多半是在说：我还没被说服，可是我说不出哪里不对。</p>
        <p>这时候把字放大，没有用。含糊被放大，仍然是含糊。</p>
        <p>我会反问一句：你希望别人记住哪五个字。五个字一旦定下来，大小、留白、颜色都有了主人。气是从这句话里来的，不是从字号里来的。</p>
        <p>如果对方一个字也定不下来，我就先不改稿。我们把那五个字写在纸上，写完再谈大气。</p>
      </div>
