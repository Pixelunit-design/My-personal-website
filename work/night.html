      <div class="prose">
        <p>一本诗人自印的诗集。六十四页，锁线胶装。诗不长，页要留得下呼吸。</p>
        <p>内文用宋体，页边很宽。标题不放进页眉，怕每一页都在说话。封面是黑卡，只有书名和一条压凹的细线，没有图。</p>
        <p>印了三百本。再版时只改了一处：环衬从白换成了和封面接近的深灰，翻开时不那么刺眼。</p>
