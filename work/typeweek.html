        <p>杭州一场很小的字体聚会，听众不到八十人。海报贴在美院校园和两家独立书店。</p>
        <p>远看是四个字，近看才是活动信息。信息集中在右下，字很小。日期下面托一条两毫米的红线，整张海报只有这一处颜色。</p>
        <p>大张是 70 × 100 厘米。书店橱窗另做了一张小的，字的关系不变，只是把地址写成了这家店自己的。</p>
