      <div class="prose">
        <p>一家只做白茶的小铺，在杭州开一间店。老板不想要山水照片。</p>
        <p>罐子用米白纸，竖排「山南」，右上角一个朱红小印。不放英文。产地写成「云南 · 景迈」，印在罐底，买的人把罐子翻过来才看见。</p>
        <p>侧面原本有一段说明。删到四个字之后，纸的颜色就成了包装本身。第二季只改了印的位置，字没有加回去。</p>
      </div>
