        <p>一家社区美术馆。两个展厅，一条走廊。不需要一套视觉识别，需要人不会走错。</p>
        <p>墙是灰泥色，字用深灰，不用纯黑，避免在白墙上发硬。箭头只出现在岔路。能不用箭头的地方，就用房间的名字本身。</p>
        <p>门口的名牌和墙字用同一套字号关系。可以带走的楼层纸只有一面，折起来刚好放进票根。</p>
